<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">
  <title>MeshGate architecture: sources (Blender, text, picture, any mesh; Maya planned) produce one canonical GLB per quality tier, checked by the validator, delivered to the web, Unity, Godot and Unreal</title>
  <style>
    .card { fill: #f7f6f4; stroke: #d8d5d0; stroke-width: 1.2; }
    .plan { fill: none; stroke: #c4c0ba; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .hub { fill: #fbefe5; stroke: #d07d45; stroke-width: 2; }
    .chip { fill: #ffffff; stroke: #e2b690; stroke-width: 1; }
    .t { fill: #1d1f22; font-weight: 600; } .m { fill: #6b6e73; font-size: 12px; } .k { fill: #b0602c; font-weight: 600; }
    .cap { fill: #8a8d92; font-size: 11px; letter-spacing: .12em; font-weight: 600; }
    .a { stroke: #d07d45; stroke-width: 1.6; fill: none; marker-end: url(#h); }
    .ad { stroke: #c4c0ba; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#hg); }
    @media (prefers-color-scheme: dark) {
      .card { fill: #1c1e21; stroke: #34363a; } .plan { stroke: #4a4c50; } .hub { fill: #2a2119; stroke: #e09460; }
      .chip { fill: #1c1e21; stroke: #7a5236; } .t { fill: #ededed; } .m { fill: #a2a4a8; } .k { fill: #e09460; }
      .cap { fill: #8f9296; } .ad { stroke: #4a4c50; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d07d45"/></marker>
    <marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9a968f"/></marker>
  </defs>

  <text class="cap" x="20" y="30">SOURCES</text>
  <text class="cap" x="480" y="30" text-anchor="middle">ONE CANONICAL ASSET</text>
  <text class="cap" x="940" y="30" text-anchor="end">ENGINES</text>

  <rect class="card" x="20" y="48" width="250" height="58" rx="10"/>
  <text class="t" x="36" y="72">Blender</text><text class="m" x="36" y="92">add-on: Check · Fix all · Export</text>
  <rect class="card" x="20" y="118" width="250" height="58" rx="10"/>
  <text class="t" x="36" y="142">Text → 3D</text><text class="m" x="36" y="162">an AI tool writes kit code (build)</text>
  <rect class="card" x="20" y="188" width="250" height="58" rx="10"/>
  <text class="t" x="36" y="212">Picture → 3D</text><text class="m" x="36" y="232">TripoSR or a cloud generator</text>
  <rect class="card" x="20" y="258" width="250" height="58" rx="10"/>
  <text class="t" x="36" y="282">Any mesh</text><text class="m" x="36" y="302">--mesh file.glb · .fbx · .obj</text>
  <rect class="plan" x="20" y="328" width="250" height="58" rx="10"/>
  <text class="t" x="36" y="352" opacity=".8">Maya</text><text class="m" x="36" y="372">planned, v0.7</text>

  <path class="a" d="M270 77 C312 77 312 190 352 190"/>
  <path class="a" d="M270 147 C312 147 312 200 352 200"/>
  <path class="a" d="M270 217 C312 217 312 210 352 210"/>
  <path class="a" d="M270 287 C312 287 312 220 352 220"/>
  <path class="ad" d="M270 357 C312 357 312 230 352 230"/>

  <rect class="hub" x="354" y="70" width="252" height="296" rx="14"/>
  <text class="t" x="480" y="102" text-anchor="middle" font-size="17">Canonical GLB</text>
  <text class="m" x="480" y="124" text-anchor="middle">meters · Y-up · scale 1</text>
  <text class="m" x="480" y="142" text-anchor="middle">PBR materials · clean names</text>
  <text class="k" x="480" y="172" text-anchor="middle" font-size="12">one file per quality tier</text>
  <rect class="chip" x="378" y="184" width="100" height="30" rx="7"/><text class="m" x="428" y="204" text-anchor="middle">PC</text>
  <rect class="chip" x="482" y="184" width="100" height="30" rx="7"/><text class="m" x="532" y="204" text-anchor="middle">mobile high</text>
  <rect class="chip" x="378" y="220" width="100" height="30" rx="7"/><text class="m" x="428" y="240" text-anchor="middle">mobile mid</text>
  <rect class="chip" x="482" y="220" width="100" height="30" rx="7"/><text class="m" x="532" y="240" text-anchor="middle">mobile low</text>
  <text class="m" x="480" y="278" text-anchor="middle">+ .fbx and engine variants:</text>
  <text class="m" x="480" y="296" text-anchor="middle">collision, LODs, Humanoid</text>
  <line x1="378" y1="318" x2="582" y2="318" stroke="#e2b690" stroke-width="1"/>
  <text class="k" x="480" y="344" text-anchor="middle" font-size="12">validator: contract + tier budget</text>

  <path class="a" d="M606 210 C648 210 648 92 688 92"/>
  <path class="a" d="M606 214 C648 214 648 164 688 164"/>
  <path class="a" d="M606 220 C648 220 648 236 688 236"/>
  <path class="a" d="M606 226 C648 226 648 308 688 308"/>

  <rect class="card" x="690" y="62" width="250" height="60" rx="10"/>
  <text class="t" x="706" y="87">Web · Three.js</text><text class="m" x="706" y="107">meshgate-viewer.js picks the tier</text>
  <rect class="card" x="690" y="134" width="250" height="60" rx="10"/>
  <text class="t" x="706" y="159">Unity 6</text><text class="m" x="706" y="179">glTFast + com.meshgate.unity</text>
  <rect class="card" x="690" y="206" width="250" height="60" rx="10"/>
  <text class="t" x="706" y="231">Godot 4</text><text class="m" x="706" y="251">the meshgate add-on</text>
  <rect class="card" x="690" y="278" width="250" height="60" rx="10"/>
  <text class="t" x="706" y="303">Unreal 5</text><text class="m" x="706" y="323">Interchange + MeshGate plugin</text>
</svg>
