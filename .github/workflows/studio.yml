name: studio-desktop
# MeshGate Studio installers for macOS and Windows. Manual or on a version tag, so everyday pushes stay cheap.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"   # Windows runners default to cp1252; every check prints ✓
    defaults:
      run:
        working-directory: apps/studio/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: apps/studio/desktop/src-tauri }
      - name: Studio server and generation checks (pure Python)
        working-directory: .
        run: |
          python tests/generate/test_generate.py
          python tests/generate/test_providers.py
          python tests/studio/test_server.py
      - run: npm ci
      - name: Build the installer (unsigned)
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: The bundled copy of MeshGate works on its own (files, server, three.js, prompt)
        working-directory: .
        run: python tests/studio/test_bundle.py apps/studio/desktop/src-tauri/target/release/meshgate
      - uses: actions/upload-artifact@v4
        with:
          name: meshgate-studio-${{ runner.os }}
          path: |
            apps/studio/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/studio/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/studio/desktop/src-tauri/target/release/bundle/msi/*.msi
  release:
    # A version tag also gets a draft GitHub Release with both installers and the portable archive attached. It stays a draft (not visible to
    # anyone without access) until someone publishes it by hand.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Portable archive for Linux (or any OS without installing) — and check it runs unpacked
        run: |
          python scripts/make_portable.py --version "${GITHUB_REF_NAME#v}" --out dist --keep /tmp/meshgate-portable
          python tests/studio/test_bundle.py /tmp/meshgate-portable
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Draft release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # artifacts keep their bundle/<kind>/ folders; upload the installer files themselves
          mapfile -t files < <(find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*-portable.zip' \))
          printf '%s\n' "${files[@]}"
          test ${#files[@]} -gt 0
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${files[@]}" --draft --generate-notes --title "MeshGate $TAG" --repo "$GITHUB_REPOSITORY"
          fi
